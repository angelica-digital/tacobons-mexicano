<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="TacoBons - La verdadera comida mexicana en La Tebaida, Quindío. Tacos, Quesadillas, Burritos y Nachos con servicio a domicilio.">
<title>TacoBons 🌮 | Comida Mexicana en La Tebaida - Domicilios</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Bungee&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  /* ========== RESET & VARIABLES ========== */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg-dark: #120D0A;
    --bg-card: #1A100C;
    --bg-card-hover: #22150F;
    
    /* Colores exactos de la marca */
    --logo-green: #34D707;
    --logo-green-dark: #28a805;
    --logo-yellow: #FDD603;
    --logo-yellow-dark: #C9A700;
    --logo-pink: #FD0C79;
    --logo-pink-dark: #C2185B;
    --logo-teal: #02A69C;
    --logo-orange: #FD8B2F;

    --cream: #FFF8E7;
    --text: #F5E6D3;
    --text-muted: #B8A89A;
    --border: rgba(52, 215, 7, 0.25);
    --shadow-glow: 0 0 35px rgba(253, 12, 121, 0.3);
  }

  html, body {
    width: 100%;
    overflow-x: hidden !important;
    position: relative;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background-color: var(--bg-dark);
    color: var(--text);
    line-height: 1.6;
    padding-top: 60px;
  }

  h1, h2, h3, h4 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    line-height: 1.1;
  }

  a {
    text-decoration: none;
    color: inherit;
  }

  img {
    max-width: 100%;
    display: block;
  }

  /* ========== HEADER / NAVBAR ========== */
  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    background: rgba(18, 13, 10, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 9999;
    padding: 10px 0;
    transition: all 0.3s ease;
  }

  .navbar-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 24px;
  }

  .nav-links {
    display: flex;
    gap: 24px;
    list-style: none;
    align-items: center;
  }

  .nav-links a {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    position: relative;
    transition: color 0.3s ease;
  }

  .nav-links a:hover {
    color: var(--logo-green);
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0;
    width: 0;
    height: 2px;
    background: var(--logo-green);
    transition: width 0.3s ease;
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .nav-cta {
    background: linear-gradient(135deg, var(--logo-green) 0%, var(--logo-yellow) 100%);
    color: #120D0A;
    padding: 11px 22px;
    border-radius: 50px;
    font-weight: 800;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 14px rgba(52, 215, 7, 0.4);
    border: none;
    cursor: pointer;
  }

  .nav-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(52, 215, 7, 0.6);
  }

  .menu-toggle {
    display: none;
    background: none;
    border: none;
    color: var(--logo-green);
    font-size: 24px;
    cursor: pointer;
  }

  /* ========== HERO ========== */
  .hero {
    position: relative;
    min-height: 92vh;
    display: flex;
    align-items: center;
    padding: 60px 24px 80px 24px;
    overflow: hidden;
    background:
      radial-gradient(circle at 10% 20%, rgba(253, 12, 121, 0.14) 0%, transparent 45%),
      radial-gradient(circle at 90% 80%, rgba(52, 215, 7, 0.12) 0%, transparent 45%),
      radial-gradient(circle at 70% 20%, rgba(253, 214, 3, 0.10) 0%, transparent 40%),
      linear-gradient(180deg, #1A100C 0%, #120D0A 100%);
  }

  .hero::before {
    content: '🌶️';
    position: absolute;
    font-size: 200px;
    top: 10%;
    right: 5%;
    opacity: 0.08;
    transform: rotate(25deg);
    pointer-events: none;
  }

  .hero::after {
    content: '🌮';
    position: absolute;
    font-size: 280px;
    bottom: -5%;
    left: -3%;
    opacity: 0.06;
    transform: rotate(-15deg);
    pointer-events: none;
  }

  .hero-container {
    max-width: 1280px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 60px;
    align-items: center;
    width: 100%;
    position: relative;
    z-index: 2;
  }

  .hero-content .hero-logo {
    height: 90px;
    width: auto;
    object-fit: contain;
    margin-bottom: 28px;
    display: block;
    filter: drop-shadow(0 0 18px rgba(52, 215, 7, 0.4));
    transition: transform 0.3s ease;
  }

  .hero-content .hero-logo:hover {
    transform: scale(1.04);
  }

  .hero-content .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(52, 215, 7, 0.15);
    color: var(--logo-green);
    padding: 8px 18px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 24px;
    border: 1px solid rgba(52, 215, 7, 0.3);
  }

  .hero-content .badge .dot {
    width: 8px;
    height: 8px;
    background: var(--logo-green);
    border-radius: 50%;
    animation: pulse-dot 1.5s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.3); }
  }

  .hero h1 {
    font-size: clamp(32px, 4.2vw, 54px);
    color: var(--cream);
    margin-bottom: 20px;
    line-height: 1.1;
  }

  .hero h1 .highlight {
    background: linear-gradient(90deg, var(--logo-green) 0%, var(--logo-yellow) 35%, var(--logo-pink) 50%, var(--logo-yellow) 65%, var(--logo-green) 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    display: inline-block;
    animation: shimmer-text 3s linear infinite;
  }

  @keyframes shimmer-text {
    to {
      background-position: 200% center;
    }
  }

  .hero h1 .emoji-fade {
    display: inline-block;
    animation: bounce-emoji 2s ease-in-out infinite;
  }

  @keyframes bounce-emoji {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-10px) rotate(8deg); }
  }

  .hero p.subtitle {
    font-size: 17px;
    color: var(--text-muted);
    margin-bottom: 32px;
    max-width: 540px;
  }

  .hero-buttons {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 36px;
  }

  .btn {
    padding: 16px 28px;
    border-radius: 50px;
    font-weight: 700;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.3s ease;
    cursor: pointer;
    border: none;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--logo-orange) 0%, var(--logo-pink) 100%);
    color: #120D0A;
    font-weight: 800;
    box-shadow: 0 8px 24px rgba(253, 12, 121, 0.4);
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(253, 12, 121, 0.6);
  }

  .btn-secondary {
    background: transparent;
    color: var(--logo-yellow);
    border: 2px solid var(--logo-yellow);
  }

  .btn-secondary:hover {
    background: var(--logo-yellow);
    color: var(--bg-dark);
    transform: translateY(-3px);
  }

  .btn-whatsapp {
    background: linear-gradient(135deg, var(--logo-green) 0%, var(--logo-yellow) 100%);
    color: #120D0A;
    font-weight: 800;
    box-shadow: 0 8px 24px rgba(52, 215, 7, 0.4);
  }

  .btn-whatsapp:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(52, 215, 7, 0.6);
  }

  .hero-stats {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
  }

  .stat-number {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: 28px;
    color: var(--logo-yellow);
  }

  .stat-label {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* ========== CONTENEDOR DE LA IMAGEN CON BORDE Y SOMBRA ROSA ========== */
  .hero-image-wrapper {
    position: relative;
    max-width: 420px;
    margin: 0 auto;
    border-radius: 28px;
    overflow: visible;
    aspect-ratio: 4 / 5;
    border: 2px solid rgba(253, 12, 121, 0.45);
    background: rgba(26, 16, 12, 0.6);
    backdrop-filter: blur(8px);
    box-shadow: 0 25px 50px rgba(0,0,0,0.7), 0 0 35px rgba(253, 12, 121, 0.35);
    transition: all 0.4s ease;
  }

  .hero-image-wrapper:hover {
    transform: scale(1.02);
    border-color: rgba(253, 12, 121, 0.8);
    box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 45px rgba(253, 12, 121, 0.5);
  }

  .hero-image-wrapper img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    border-radius: 26px;
  }

  /* Emojis flotantes decorativos */
  .floating-emoji {
    position: absolute;
    font-size: 32px;
    z-index: 5;
    filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    animation: float-emoji 3s ease-in-out infinite;
  }

  .emoji-taco {
    top: -15px;
    left: -20px;
    animation-delay: 0s;
  }

  .emoji-burrito {
    bottom: -15px;
    right: -20px;
    animation-delay: 1.5s;
  }

  @keyframes float-emoji {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(6deg); }
  }

  /* ========== SECCIONES GENERALES ========== */
  section {
    padding: 100px
